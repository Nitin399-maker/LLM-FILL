<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Word Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-md-11">
                <div class="text-center mb-3">
                    <h1 class="fs-3 fw-bold text-primary"><i class="bi bi-braces"></i> LLM Word Predictor</h1>
                    <p class="small text-muted">Explore how language models predict missing words in sentences</p>
                </div>
                
                <div class="card shadow rounded-3 border-0 mb-3">
                    <div class="card-header bg-primary bg-gradient text-white py-2 rounded-top-3">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-cpu me-2"></i>
                            <div>
                                <h3 class="mb-0 fs-5 fw-semibold">Model Playground</h3>
                                <p class="mb-0 mt-1 opacity-75 small">Select a model and start experimenting</p>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-3">
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="modelSelect" class="form-label small fw-semibold"><i class="bi bi-robot me-1"></i>Select LLM Model</label>
                                <select id="modelSelect" class="form-select shadow-sm">
                                    <option value="openai/gpt-4.1-nano">OpenAI GPT-4.1 Nano</option>
                                    <option value="openai/gpt-4.1-mini">OpenAI GPT-4.1 Mini</option>
                                    <option value="openai/gpt-4.1">OpenAI GPT-4.1</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="apiKey" class="form-label small fw-semibold"><i class="bi bi-key-fill me-1"></i>OpenRouter API Key</label>
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-primary text-white"><i class="bi bi-shield-lock"></i></span>
                                    <input type="password" class="form-control" id="apiKey" placeholder="Enter your API key">
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="card bg-white rounded-3 border-0 shadow-sm">
                                <div class="card-body p-3">
                                    <h5 class="card-title mb-2 fs-6 d-flex align-items-center">
                                        <span class="badge bg-primary me-2 p-1"><i class="bi bi-chat-dots-fill"></i></span>
                                        Enter your sentence
                                    </h5>
                                    <div class="input-group mb-2 shadow-sm">
                                        <input type="text" class="form-control" id="sentenceInput"
                                            placeholder="Type a sentence, then click Process">
                                        <button class="btn btn-primary px-3 btn-sm fw-semibold" type="button" id="processBtn">
                                            <i class="bi bi-arrow-right-circle-fill me-1"></i> Process
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <h5 class="d-flex align-items-center mb-2 fs-6">
                                <span class="badge bg-success me-2 p-1"><i class="bi bi-cursor-text"></i></span>
                                Interactive Sentence
                            </h5>
                            <div id="interactiveSentence" class="p-3 d-flex flex-wrap align-items-center bg-white rounded-3 shadow-sm border-0" style="min-height: 50px;">
                                <p class="text-muted mb-0 small fst-italic">Enter a sentence above and click "Process"</p>
                            </div>
                        </div>
                        <div id="predictionArea" class="d-none">
                            <div class="card border-0 shadow rounded-3 mb-3">
                                <div class="card-header bg-gradient-primary bg-primary text-white rounded-top-3 py-2 px-3 d-flex justify-content-between align-items-center">
                                    <h5 class="mb-0 d-flex align-items-center fs-6">
                                        <i class="bi bi-lightning-charge-fill me-1"></i>
                                        Prediction Status
                                    </h5>
                                </div>
                                <div id="loadingSpinner" class="card-body text-center py-3 d-none">
                                    <div class="spinner-border text-primary mb-2" role="status" style="width: 2rem; height: 2rem;">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="text-muted small">Asking the model to predict...</p>
                                </div>
                                <div id="predictionResults" class="card-body p-0">
                                </div>
                            </div>
                            <div class="row g-2 mt-3" id="probabilityTables">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
